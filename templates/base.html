<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ site_description }}{% endblock %}">
  <link rel="stylesheet" href="{{ '../static/style.css' if post is defined else 'static/style.css' }}">

  <!--
    ====================================================================
    GOOGLE ADSENSE - SCRIPT PRINCIPAL (khass tzido f <head>, mera wahda)
    ====================================================================
    1) Sajel f https://www.google.com/adsense (free, khass site verifié)
    2) 3wed "ca-pub-XXXXXXXXXXXXXXXX" b l'ID dyalek li Google ghadi i3tik
    3) Neḥi l'commentaire (<!-- -->) bach yb9a ykhdem
  -->
  <!--
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>
  -->
</head>
<body>

  <header class="site-header">
    <a href="{{ '../index.html' if post is defined else 'index.html' }}" class="logo">{{ site_name }}</a>
    <p class="tagline">{{ site_description }}</p>
  </header>

  <!-- ============ AD SLOT #1 : BANNER TOP (top de page) ============ -->
  <div class="ad-slot ad-banner-top">
    <span class="ad-label">Publicité</span>
    <!--
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="1111111111"
         data-ad-format="horizontal"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <main class="site-layout">
    <div class="content-column">
      {% block content %}{% endblock %}
    </div>

    <aside class="sidebar-column">
      <!-- ============ AD SLOT #2 : SIDEBAR (jnib l'contenu) ============ -->
      <div class="ad-slot ad-sidebar">
        <span class="ad-label">Publicité</span>
        <!--
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="2222222222"
             data-ad-format="vertical"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
      </div>
    </aside>
  </main>

  <!-- ============ AD SLOT #3 : FOOTER (taht kolchi) ============ -->
  <div class="ad-slot ad-footer">
    <span class="ad-label">Publicité</span>
    <!--
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="3333333333"
         data-ad-format="horizontal"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> {{ site_name }} — Contenu généré et mis à jour automatiquement.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
